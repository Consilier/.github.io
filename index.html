<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hărțile mele</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --panel:#FFFFFF; --ink:#16303F; --muted:#5B6E78;
  --line:#CFD9D4; --accent:#1F6B52; --accent-ink:#FFFFFF; --warn:#9A5B12;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1F; --panel:#172630; --ink:#E4ECEA; --muted:#93A6AE;
    --line:#2A3C46; --accent:#4FB08A; --accent-ink:#0B1A14; --warn:#E0A55C;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --panel:#172630; --ink:#E4ECEA; --muted:#93A6AE;
  --line:#2A3C46; --accent:#4FB08A; --accent-ink:#0B1A14; --warn:#E0A55C;
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.45;
  background-image:repeating-radial-gradient(circle at 85% -10%, transparent 0 38px, color-mix(in srgb,var(--line) 55%,transparent) 38px 39px);
  background-attachment:fixed;
}
main{max-width:680px; margin:0 auto; padding:28px 18px 48px}
header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px}
h1{font-size:2.1rem; line-height:1.1; margin:0; font-weight:700; letter-spacing:-.01em}
.sub{color:var(--muted); margin:4px 0 0; font-size:.95rem}
#refresh{
  background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px;
  padding:9px 14px; font:inherit; font-size:.95rem; cursor:pointer; flex:none;
}
#refresh[disabled]{opacity:.6; cursor:default}
#q{
  width:100%; padding:11px 14px; font:inherit; color:var(--ink);
  background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:14px;
}
ul{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li a{display:block; padding:13px 4px; color:inherit; text-decoration:none}
li a:active,li a:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.name{font-weight:600; font-size:1.08rem; display:block}
.meta{color:var(--muted); font-size:.85rem; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.desc{color:var(--muted); font-size:.92rem; display:block; margin-top:2px}
.msg{padding:18px 4px; color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:2px;border:1px solid var(--line);color:var(--muted)}
.tag.priv{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.forget{background:none;border:0;padding:0;margin-top:6px;font:inherit;font-size:.85rem;color:var(--muted);text-decoration:underline;cursor:pointer}
.note{margin-top:14px; font-size:.9rem; color:var(--warn); min-height:1.2em}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Hărțile mele</h1>
      <p class="sub" id="sub">Se încarcă lista…</p>
    </div>
    <button id="refresh" type="button">Actualizează acum</button>
  </header>
  <input id="q" type="search" placeholder="Caută o hartă" hidden>
  <ul id="list"><li class="msg">Se încarcă…</li></ul>
  <p class="note" id="note"></p>
  <button class="forget" id="forget" type="button" hidden>Șterge tokenul salvat pe acest dispozitiv</button>
</main>
<script>
(function(){
  var items = [], filter = '', generated = null;
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(iso, withTime){
    try {
      var o = {day:'numeric', month:'short', year:'numeric'};
      if (withTime){ o.hour = '2-digit'; o.minute = '2-digit'; }
      return new Date(iso).toLocaleString('ro-RO', o);
    } catch(e){ return ''; }
  }

  function render(){
    var f = filter.toLowerCase();
    var shown = items.filter(function(it){
      return !f || [it.title, it.repo, it.path, it.owner, it.desc].join(' ').toLowerCase().indexOf(f) > -1;
    });
    $('q').hidden = items.length < 6;
    $('sub').textContent = (items.length
      ? items.length + (items.length === 1 ? ' hartă publicată' : ' hărți publicate')
      : 'Nicio hartă găsită încă')
      + (generated ? ' · listă actualizată ' + fmt(generated, true) : '');
    if (!shown.length){
      $('list').innerHTML = '<li class="msg">' + (items.length ? 'Nicio hartă nu se potrivește căutării.' : 'Lista e goală. Verifică în tab-ul Actions al repo-ului că workflow-ul „Catalog hărți” a rulat.') + '</li>';
      return;
    }
    $('list').innerHTML = shown.map(function(it){
      return '<li><a href="' + esc(it.url) + '">'
        + '<span class="name">' + esc(it.title) + (it.private ? '<span class="tag priv">privat</span>' : '') + '</span>'
        + (it.desc ? '<span class="desc">' + esc(it.desc) + '</span>' : '')
        + '<span class="meta">' + esc(it.owner + ' / ' + it.repo + (it.path ? ' / ' + it.path : '')) + ' · ' + esc(fmt(it.updated)) + '</span>'
        + '</a></li>';
    }).join('');
  }

  function load(){
    return fetch('maps.json?t=' + Date.now(), {cache:'no-store'}).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){
      items = d.items || []; generated = d.generated || null; render(); return generated;
    }).catch(function(e){
      $('note').textContent = 'Nu am putut încărca lista (' + e.message + '). Workflow-ul „Catalog hărți” n-a rulat încă?';
      render();
    });
  }

  // ---- Actualizare la cerere: pornește workflow-ul din GitHub ----
  var host = location.hostname.toLowerCase();
  var OWNER = host.endsWith('.github.io') ? host.split('.')[0] : '';
  var REPO = OWNER + '.github.io';
  var TK = 'catalog-token';
  var busy = false;

  function getToken(){ try { return localStorage.getItem(TK); } catch(e){ return null; } }
  function setToken(t){ try { t ? localStorage.setItem(TK, t) : localStorage.removeItem(TK); } catch(e){} $('forget').hidden = !t; }
  function gh(path, opts){
    opts = opts || {};
    opts.headers = {'Authorization':'Bearer ' + getToken(), 'Accept':'application/vnd.github+json'};
    return fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + path, opts);
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function status(t){ $('note').textContent = t; }

  async function updateNow(){
    if (busy) return;
    if (!OWNER){ status('Butonul funcționează doar pe adresa utilizator.github.io.'); return; }
    var tok = getToken();
    if (!tok){
      tok = (prompt('Lipește tokenul GitHub (fine-grained, cu acces doar la ' + REPO + ', permisiunea Actions: Read and write). Se păstrează doar pe acest dispozitiv.') || '').trim();
      if (!tok) return;
      setToken(tok);
    }
    busy = true; $('refresh').disabled = true;
    var started = new Date(Date.now() - 5000).toISOString();
    try {
      status('Pornesc actualizarea…');
      var r = await gh('/actions/workflows/catalog.yml/dispatches', {method:'POST', body: JSON.stringify({ref:'main'})});
      if (r.status === 401 || r.status === 403){ setToken(null); throw new Error('tokenul nu e valid sau nu are permisiunea Actions. Încearcă din nou cu alt token.'); }
      if (r.status === 404) throw new Error('nu găsesc workflow-ul catalog.yml sau tokenul nu are acces la ' + REPO + '.');
      if (!r.ok) throw new Error('GitHub a răspuns ' + r.status + '.');

      var run = null, t0 = Date.now();
      while (Date.now() - t0 < 5 * 60 * 1000){
        await sleep(5000);
        var rr = await gh('/actions/workflows/catalog.yml/runs?event=workflow_dispatch&per_page=5&created=' + encodeURIComponent('>=' + started.slice(0,19) + 'Z'));
        if (rr.ok){
          var d = await rr.json();
          run = (d.workflow_runs || [])[0] || null;
        }
        var secs = Math.round((Date.now() - t0) / 1000);
        if (!run){ status('Aștept să pornească… (' + secs + ' s)'); continue; }
        if (run.status !== 'completed'){ status('Se caută hărțile și se publică lista… (' + secs + ' s, de obicei sub un minut)'); continue; }
        break;
      }
      if (!run || run.status !== 'completed') throw new Error('durează mai mult decât de obicei. Verifică tab-ul Actions din GitHub.');
      if (run.conclusion !== 'success') throw new Error('workflow-ul s-a terminat cu eroare (' + run.conclusion + '). Detalii în tab-ul Actions.');

      // lista nouă poate întârzia câteva secunde în cache-ul GitHub Pages
      var before = generated;
      for (var i = 0; i < 12; i++){
        await load();
        if (generated && generated !== before) break;
        status('Lista e gata, aștept să ajungă pe site…');
        await sleep(5000);
      }
      status(generated !== before ? 'Lista a fost actualizată.' : 'Workflow-ul a rulat; dacă lista nu s-a schimbat, reîncarcă pagina peste un minut.');
    } catch(e){
      status('Actualizarea n-a reușit: ' + e.message);
    } finally {
      busy = false; $('refresh').disabled = false;
    }
  }

  $('q').addEventListener('input', function(){ filter = this.value; render(); });
  $('refresh').addEventListener('click', updateNow);
  $('forget').addEventListener('click', function(){ setToken(null); status('Tokenul a fost șters de pe acest dispozitiv.'); });
  $('forget').hidden = !getToken();
  load();
})();
</script>
</body>
</html>
